[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wasabi-benchmark"
version = "0.1.0"
description = "Independent Pi + Wasabi evaluation harness inspired by InteractiveSWEAgents"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
data = ["openpyxl>=3.1,<4"]

[tool.setuptools.packages.find]
include = ["harness*", "scripts*"]
